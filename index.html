  <script>
    function switchTab(tabId, btnElement) {
      var tabs = document.querySelectorAll('.tab-content');
      var btns = document.querySelectorAll('.tab-btn');
      for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    function generateSummary() {
      var text = document.getElementById('lectureText').value.trim();
      var resultBox = document.getElementById('summaryResult');
      var btn = document.querySelector('#konspekt .btn');

      if (!text) {
        alert("Iltimos, ma'ruza matnini kiriting!");
        return;
      }

      resultBox.style.display = 'block';
      resultBox.innerHTML = "⏳ AI ma'ruzani tahlil qilmoqda... Kuting...";
      btn.disabled = true;
      btn.style.opacity = "0.6";

      var promptText = "Sen universitet talabalari uchun aqlli yordamchisan. Quyidagi matnni tahlil qilib, eng muhim 3 ta qisqa tezisni va imtihon uchun 2 ta test savolini o'zbek tilida chiroyli formatda yaratib ber:\n\n" + text;

      fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: promptText })
      })
      .then(function(response) { return response.json(); })
      .then(function(data) {
        if (data.error) {
          resultBox.innerHTML = "❌ Xatolik: " + data.error;
        } else {
          resultBox.innerHTML = data.text.split('\n').join('<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        }
      })
      .catch(function(error) {
        resultBox.innerHTML = "❌ Server bilan ulanishda xatolik yuz berdi.";
      })
      .finally(function() {
        btn.disabled = false;
        btn.style.opacity = "1";
      });
    }

    function sendMessage() {
      var input = document.getElementById('userInput');
      var text = input.value.trim();
      if (!text) return;

      addMsg(text, 'user', null);
      input.value = '';

      var typingId = "typing-" + Date.now();
      addMsg("⏳ Domla javob yozmoqda...", 'bot', typingId);

      var promptText = "Sen OTMning talabchan, lekin adolatli domlasisan. Talaba senga javob yozadi. Uning javobini qisqacha tahlil qil, ball ber (10 ballik tizimda) va mavzuni chuqurlashtirish uchun keyingi savolni so'ra. Javoblar doim o'zbek tilida va qisqa bo'lsin. Talaba javobi: " + text;

      fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: promptText })
      })
      .then(function(response) { return response.json(); })
      .then(function(data) {
        var typingEl = document.getElementById(typingId);
        if (typingEl) typingEl.parentNode.removeChild(typingEl);

        if (data.error) {
          addMsg("❌ Xatolik: " + data.error, 'bot', null);
        } else {
          addMsg(data.text, 'bot', null);
        }
      })
      .catch(function(error) {
        var typingEl = document.getElementById(typingId);
        if (typingEl) typingEl.parentNode.removeChild(typingEl);
        addMsg("❌ Server bilan bog'lanishda xatolik.", 'bot', null);
      });
    }
 function addMsg(text, sender, id) {
      var chatBox = document.getElementById('chatBox');
      var div = document.createElement('div');
      div.className = "msg " + sender;
      if (id) div.id = id;
      div.innerHTML = text.split('\n').join('<br>').replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speakLastBotMsg() {
      var botMsgs = document.querySelectorAll('.msg.bot');
      if (botMsgs.length === 0) return;
      var lastMsg = botMsgs[botMsgs.length - 1].innerText;
      
      var speech = new SpeechSynthesisUtterance(lastMsg);
      speech.lang = 'uz-UZ';
      window.speechSynthesis.speak(speech);
    }
  </script>
